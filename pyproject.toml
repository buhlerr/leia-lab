[project]
name = "leia-lab"
version = "0.1.0"
description = "Ambiente isolado de estudo de DB e IA sobre analise de minutas contratuais"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pydantic-ai>=0.0.20",
    "streamlit>=1.40.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "langgraph>=1.2.22,<2",
    "django>=5.1,<6",
    "psycopg[binary]>=3.2,<4",
    "gunicorn>=23,<24",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
